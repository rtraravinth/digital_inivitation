# Render blueprint: one web service (the Dockerfile — frontend and API behind
# one address) and its PostgreSQL. In Render: New → Blueprint → pick this
# repository. Every push to main redeploys.
#
# Both are on the free plan, which is for trying it out, not for keeping:
#   - a free service sleeps when idle and its disk is wiped when it wakes, so
#     UPLOADED PICTURES DO NOT SURVIVE. For them to last, set `plan: starter`
#     on the service and uncomment the `disk` block below.
#   - a free database is deleted after a limited period. Set a paid `plan` on
#     the database before relying on it.

databases:
  - name: facet-db
    plan: free
    databaseName: facet

services:
  - type: web
    name: facet
    runtime: docker
    plan: free
    healthCheckPath: /health
    # disk:
    #   name: facet-media
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: FACET_ENV
        value: prod
      - key: FACET_DATABASE_URL
        fromDatabase:
          name: facet-db
          property: connectionString
      # Signs every access token. Generated once and kept; changing it signs
      # everybody out.
      - key: FACET_JWT_SECRET
        generateValue: true
      # With the disk above, change this to /var/data/media.
      - key: FACET_MEDIA_ROOT
        value: /app/backend/media
      # Firebase Authentication. The project id is all the API needs to
      # verify a sign-in; the four NEXT_PUBLIC_ values are the web app's
      # config from Firebase → Project settings → Your apps. They are public
      # (they ship to every browser) but read at build time, so set them
      # before the first deploy. Entered in the dashboard, not committed.
      - key: FACET_FIREBASE_PROJECT_ID
        sync: false
      # The service-account key JSON (Project settings → Service accounts).
      # A secret: it lets the API ask Firebase whether a user was disabled,
      # deleted or had their sessions revoked, so FACET signs them out too.
      - key: FACET_FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
      # A demo account with the five seeded portfolios, created on first
      # start. It has no password: sign in through Firebase with this
      # address — it must be one whose inbox you can open, because Firebase
      # has to verify it before the two are linked. Delete it to have none.
      - key: FACET_DEMO_EMAIL
        sync: false
