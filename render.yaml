# Render blueprint: one web service (the Dockerfile — frontend and API behind
# one address) and its PostgreSQL. In Render: New → Blueprint → pick this
# repository. Every push to main redeploys.
#
# Both are on the free plan, which is for trying it out, not for keeping:
#   - a free service sleeps when idle and its disk is wiped when it wakes, so
#     UPLOADED PICTURES DO NOT SURVIVE on its disk. For them to last, either
#     store them in Cloudflare R2 (set FACET_STORAGE=r2 and the FACET_R2_*
#     values below) or set `plan: starter` and uncomment the `disk` block.
#   - a free database is deleted after a limited period. Set a paid `plan` on
#     the database before relying on it.

databases:
  - name: facet-db
    plan: free
    databaseName: facet

services:
  - type: web
    name: facet
    runtime: docker
    plan: free
    healthCheckPath: /health
    # disk:
    #   name: facet-media
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: FACET_ENV
        value: prod
      - key: FACET_DATABASE_URL
        fromDatabase:
          name: facet-db
          property: connectionString
      # Signs every access token. Generated once and kept; changing it signs
      # everybody out.
      - key: FACET_JWT_SECRET
        generateValue: true
      # With the disk above, change this to /var/data/media.
      - key: FACET_MEDIA_ROOT
        value: /app/backend/media
      # Uploads in a private Cloudflare R2 bucket instead of the disk: set
      # FACET_STORAGE to r2 and fill in the bucket's S3 endpoint
      # (https://<account id>.r2.cloudflarestorage.com), name and an
      # Object Read & Write token for that bucket alone.
      - key: FACET_STORAGE
        value: disk
      - key: FACET_R2_ENDPOINT
        sync: false
      - key: FACET_R2_BUCKET
        sync: false
      - key: FACET_R2_ACCESS_KEY_ID
        sync: false
      - key: FACET_R2_SECRET_ACCESS_KEY
        sync: false
      # Firebase Authentication. The project id is all the API needs to
      # verify a sign-in; the four NEXT_PUBLIC_ values are the web app's
      # config from Firebase → Project settings → Your apps. They are public
      # (they ship to every browser) but read at build time, so set them
      # before the first deploy. Entered in the dashboard, not committed.
      - key: FACET_FIREBASE_PROJECT_ID
        sync: false
      # The service-account key JSON (Project settings → Service accounts).
      # A secret: it lets the API ask Firebase whether a user was disabled,
      # deleted or had their sessions revoked, so FACET signs them out too.
      - key: FACET_FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
      # The domain pages publish under: rohan.facetfolio.com/founder. Read
      # at build time by the frontend and at start by the API. In Render, add
      # both facetfolio.com and the wildcard *.facetfolio.com as custom
      # domains (Settings → Custom Domains); a wildcard needs the DNS records
      # Render lists for it, including its _acme-challenge CNAME.
      - key: NEXT_PUBLIC_ROOT_DOMAIN
        value: facetfolio.com
      # This service's own onrender.com name (facet-xxxx.onrender.com), so it is still the app and not
      # read as somebody's custom domain. Comma-separated if more than one.
      - key: FACET_APP_HOSTS
        sync: false
      # Where an owner's custom domain points. The CNAME target for a
      # www-style name; Render's load balancer address for a bare domain's A
      # record. An owner's domain also has to be added to this service in
      # Render before it gets an HTTPS certificate.
      - key: FACET_DOMAIN_CNAME_TARGET
        sync: false
      - key: FACET_DOMAIN_APEX_IPS
        value: '["216.24.57.1"]'
      # A demo account with the five seeded portfolios, created on first
      # start. It has no password: sign in through Firebase with this
      # address — it must be one whose inbox you can open, because Firebase
      # has to verify it before the two are linked. Delete it to have none.
      - key: FACET_DEMO_EMAIL
        sync: false
